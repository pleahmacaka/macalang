# Maca self-manifest, dogfooded as features land.
[package]
name = "maca"
version = "0.3.0"

[workspace]
members = [
    "modules/bench",
    "modules/cli",
    "modules/http",
    "modules/profile",
    "modules/signal",
    "modules/std",
    "modules/tambo",
    "modules/web",
    "apps/bench",
    "apps/bench_demo",
    "apps/blink",
    "apps/cli_tool",
    "apps/desktop",
    "apps/mcmod",
    "apps/microkernel",
    "apps/mqtt",
    "apps/playground",
    "apps/profile_demo",
    "apps/signal_demo",
    "apps/site",
    "apps/tambo_demo",
    "apps/tomo",
]

[format]
indent = 4
width = 80

[lint]
strict = true

[scripts]
hello = "maca run examples/hello.maca"
taskr = "maca run examples/taskr.maca"

[[bin]]
name = "taskr"
path = "examples/taskr.maca"
