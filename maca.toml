# Maca self-manifest, dogfooded as features land.
[package]
name = "maca"
version = "0.7.1"

[workspace]
members = [
    "modules/ai",
    "modules/bench",
    "modules/chaski",
    "modules/cli",
    "modules/http",
    "modules/i18n",
    "modules/maca",
    "modules/profile",
    "modules/signal",
    "modules/std",
    "modules/tambo",
    "modules/web",
    "apps/bench",
    "apps/bench_demo",
    "apps/bindgen",
    "apps/blink",
    "apps/build_site",
    "apps/cli_tool",
    "apps/corpus",
    "apps/desktop",
    "apps/evals",
    "apps/examples",
    "apps/quipu",
    "apps/install",
    "apps/lint",
    "apps/lsp",
    "apps/maca1",
    "apps/macadoc",
    "apps/mcp",
    "apps/mcmod",
    "apps/microkernel",
    "apps/mqtt",
    "apps/npm",
    "apps/playground",
    "apps/profile_demo",
    "apps/signal_demo",
    "apps/site",
    "apps/tambo_demo",
    "apps/tomo",
]

[format]
indent = 4
width = 80

[lint]
strict = true

[scripts]
hello = "maca run apps/examples/hello.maca"
taskr = "maca run apps/examples/taskr.maca"

[[bin]]
name = "taskr"
path = "apps/examples/taskr.maca"
