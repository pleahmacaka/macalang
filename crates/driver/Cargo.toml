license.workspace = true

[[bin]]
name = "maca"
path = "src/main.rs"

[dependencies]
maca-lexer = { path = "../lexer" }
maca-parser = { path = "../parser" }
maca-core = { path = "../core" }
maca-backend-c = { path = "../backend_c" }
maca-backend-nix = { path = "../backend_nix" }
maca-backend-js = { path = "../backend_js" }
maca-backend-jvm = { path = "../backend_jvm" }
maca-backend-rust = { path = "../backend_rust" }
maca-runtime = { path = "../runtime" }
maca-stdlib = { path = "../stdlib" }
maca-profile = { path = "../profile" }
serde_json = "1"

[dev-dependencies]
maca-testsupport = { path = "../testsupport" }
maca-lsp = { path = "../lsp" }
maca-stdlib = { path = "../stdlib" }
