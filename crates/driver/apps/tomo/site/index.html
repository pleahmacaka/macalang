<!doctype html>
<html lang="">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<style>
:root{color-scheme:light dark;--fg:#1a1a1a;--bg:#fdfdfc;--mut:#666;--line:#e2e2df;--code:#f4f4f1}
@media(prefers-color-scheme:dark){:root{--fg:#e8e8e6;--bg:#191919;--mut:#9a9a95;--line:#333;--code:#232323}}
body{max-width:44rem;margin:0 auto;padding:2rem 1.25rem 5rem;background:var(--bg);color:var(--fg);
  font:16px/1.7 ui-serif,Georgia,serif}
h1,h2,h3{font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.25;margin:2.2rem 0 .8rem}
h1{font-size:2rem;margin-top:.5rem}h2{font-size:1.4rem}h3{font-size:1.15rem}
code{background:var(--code);padding:.12em .35em;border-radius:3px;font:0.88em ui-monospace,monospace}
pre{background:var(--code);padding:1rem;border-radius:6px;overflow-x:auto}
pre code{background:none;padding:0}
a{color:inherit;text-decoration-color:var(--mut);text-underline-offset:2px}
nav.i18n,nav.chapters{font-family:ui-sans-serif,system-ui,sans-serif;font-size:.85rem;color:var(--mut)}
nav.i18n{border-bottom:1px solid var(--line);padding-bottom:.6rem;margin-bottom:1.2rem}
nav.chapters{border-top:1px solid var(--line);padding-top:.8rem;margin-top:2.5rem;
  display:flex;justify-content:space-between;gap:1rem}
nav.toc{background:var(--code);border-radius:6px;padding:.6rem 1rem;margin:0 0 1.6rem;
  font-family:ui-sans-serif,system-ui,sans-serif;font-size:.9rem}
nav.toc ul{margin:0;padding-left:1.1rem}
li{margin:.2rem 0}
</style>
</head>
<body>
<nav class="i18n"><strong></strong> </nav>
<h1></h1>
<nav class="toc">
<ul>
<li><a href=".html"></a></li>
</ul>
</nav>
</body>
</html>
