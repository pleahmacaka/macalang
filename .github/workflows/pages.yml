name: pages

# Publishes two things built by Maca itself:
#   /          the handbook's language picker
#   /en /ko    The Maca Handbook, rendered by apps/tomo/tomo.maca
#   /play      the browser playground, one self-contained page
#
# Both are produced by the compiler in this repository — the book by a Maca
# program, the playground by `maca build --target js` — so a broken site means a
# broken toolchain, not a broken deploy script.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs to read the repo and mint an id-token for the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let an in-flight one finish rather than
# cancelling it, so a half-published site can't be left behind.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: pages

      # The book builder compiles to a native binary through the C backend, so
      # the host needs a C compiler exactly as `cargo test` does.
      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Build the compiler
        run: cargo build --release -p maca-driver

      # `tomo.maca` resolves `apps/tomo` relative to the working directory, so
      # it runs from the repo root and writes apps/tomo/site/{index,en,ko}.
      - name: Build the handbook
        run: ./target/release/maca run apps/tomo/tomo.maca

      - name: Build the in-browser compiler
        run: cargo build -p maca-wasm --target wasm32-unknown-unknown --release

      # `--target js` inlines the styles, the transpiled app and the wasm (as
      # base64) into one self-contained index.html.
      - name: Build the playground
        working-directory: playground
        run: ../target/release/maca build --target js playground.maca -o out

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r apps/tomo/site/. _site/
          mkdir -p _site/play
          cp -r playground/out/. _site/play/
          # Jekyll would otherwise drop files and directories beginning with `_`.
          touch _site/.nojekyll

      # Fail here rather than publishing a site with holes: every page the root
      # links to must exist, and the playground must have its compiler inlined.
      - name: Check the site
        run: |
          set -euo pipefail
          for f in _site/index.html _site/en/index.html _site/ko/index.html \
                   _site/en/search-index.js _site/ko/search-index.js \
                   _site/play/index.html; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          chapters=$(ls _site/en/*.html | wc -l)
          test "$chapters" -ge 20 || { echo "only $chapters English pages"; exit 1; }
          grep -q 'href="en/"' _site/index.html
          grep -q 'href="play/"' _site/index.html
          # the playground embeds the wasm compiler; a page without it is a shell
          test "$(stat -c%s _site/play/index.html)" -gt 200000 \
            || { echo "playground looks like it lost its embedded wasm"; exit 1; }
          echo "site ok: $chapters English pages, $(du -sh _site | cut -f1) total"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
