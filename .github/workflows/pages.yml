name: pages

# Publishes four things, every one of them built by Maca itself:
#   /                the front page, apps/site/home.maca
#   /en /ko          The Maca Handbook, rendered by apps/tomo/tomo.maca
#   /api             the std reference, rendered by apps/macadoc/macadoc.maca
#   /play            the browser playground, one self-contained page
#
# All of it comes out of the compiler in this repository: three Maca programs
# and one `maca build --target js`. So a broken site means a broken toolchain,
# not a broken deploy script.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs to read the repo and mint an id-token for the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let an in-flight one finish rather than
# cancelling it, so a half-published site can't be left behind.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      # The in-browser compiler is a Maca program linked by `zig cc -target
      # wasm32-wasi`, so zig is the toolchain this job needs.
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: pages

      # The book builder compiles to a native binary through the C backend, so
      # the host needs a C compiler exactly as `cargo test` does.
      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Build the compiler
        run: cargo build --release -p maca-driver

      # `import wasm` in playground.maca embeds this, so it has to exist before
      # the playground is built.
      - name: Build the in-browser compiler
        run: PATH="$PWD/target/release:$PATH" ./target/release/maca run apps/npm/build.maca

      # One script builds and checks the site, and it is the same script a
      # human runs. Keeping these steps in the workflow meant "verified
      # locally" could mean a different set of commands than CI ran, which is
      # exactly how this job broke: the root page's links changed and the
      # workflow's copy of the check kept grepping for the old ones.
      #
      # The script is a Maca program, built by the compiler it is publishing
      # the documentation for.
      - name: Build and check the site
        run: ./target/release/maca run apps/build_site/build_site.maca _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
