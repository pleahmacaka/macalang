name: release

# Cut a release either by pushing a plain semver tag (no `v` prefix):
#   git tag 0.1.0 && git push origin 0.1.0
# or by running this workflow manually with a `version` input, which creates
# the tag + release from the current commit (used when tag pushes aren't
# available). Either way the tag name is the bare version, e.g. `0.1.0`.
on:
  push:
    # `0.1.0` and pre-releases like `0.1.0-rc1`, not `v`-prefixed.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (bare semver, e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Ten jobs used to race to create the release for the same tag: whichever got
  # there first won, and a loser could exhaust its retries on `already_exists`
  # and drop its asset. 0.3.2 published nine of ten that way, and the one it
  # lost was the installer this repository's own action downloads. The release
  # is created once here instead, and every leg below only uploads into it.
  create:
    name: create the release
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}

  build:
    name: build ${{ matrix.target }}
    needs: create
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: maca-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: maca-linux-aarch64.tar.gz
          # Cross-compiled from the arm64 runner rather than built on an Intel
          # one. `macos-13` was the last Intel image and it is gone, so that leg
          # sat queued with no runner while the other four published: a release
          # that looked successful and was missing a binary. Apple's toolchain
          # emits both slices, so this does not need a machine of its own.
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: maca-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: maca-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: maca-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4

      # `matrix.target` used to name the target and nothing passed it to cargo,
      # so every leg built for whatever the runner happened to be and the field
      # was decoration. It is the build's actual target now, which is what lets
      # a leg be cross-compiled instead of needing its own machine.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p maca-driver -p maca-lsp

      # The two steps below are the only inline scripts left in this
      # repository's CI, and they stay scripts. Packaging a Maca program would
      # mean `maca run apps/package/package.maca`, which compiles that program through
      # the C backend and so needs a C compiler on the runner. Four of the five
      # legs have one; `windows-latest` does not ship a `cc`. Writing it in Maca
      # anyway would either leave a second implementation behind for Windows,
      # exactly the drift this file's siblings exist to avoid, or make cutting
      # a release depend on the compiler being able to build a program on the
      # host whose binaries the release is being cut for.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset }}" -C "target/${{ matrix.target }}/release" maca maca-lsp

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target\${{ matrix.target }}\release\maca.exe, target\${{ matrix.target }}\release\maca-lsp.exe -DestinationPath "dist\${{ matrix.asset }}" -Force

      # The standard library rides inside the binary, so packaging cannot forget
      # it and the tarball stays two files. What packaging can still lose is the
      # copy itself, and the only way to see that is from outside the checkout:
      # a program in a temp directory that imports `std/text` has nothing but
      # the binary to resolve it with. The Linux legs are the native ones with a
      # `cc`, which is what makes them the ones that can run it.
      - name: Verify the released binary carries the standard library
        if: runner.os == 'Linux'
        shell: bash
        run: |
          probe="$(mktemp -d)"
          printf 'import { lines } from std/text\n\nmain() -> int {\n    n = lines("a\\nb").length()\n    n == 2 ? 0 : 1\n}\n' > "$probe/probe.maca"
          "$PWD/target/${{ matrix.target }}/release/maca" run "$probe/probe.maca"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # a tag push carries the version in `ref_name`; a manual dispatch
          # passes it as `version` and the tag is created from this commit.
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: dist/${{ matrix.asset }}

  installer:
    name: build maca-install ${{ matrix.target }}
    needs: create
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: maca-install-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: maca-install-linux-aarch64
          - os: macos-13
            asset: maca-install-macos-x86_64
          - os: macos-latest
            asset: maca-install-macos-aarch64
          - os: windows-latest
            asset: maca-install-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      # The installer is a Maca program, so building it needs the compiler
      # first. It reads its own platform from `uname` at run time, so each leg
      # only has to run on the machine the asset is named for.
      - name: Build the compiler
        run: cargo build --release -p maca-driver
      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          ./target/release/maca build apps/install/install.maca \
            -o "dist/${{ matrix.asset }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: dist/${{ matrix.asset }}
