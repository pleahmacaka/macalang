name: release

# Cut a release either by pushing a plain semver tag (no `v` prefix):
#   git tag 0.1.0 && git push origin 0.1.0
# or by running this workflow manually with a `version` input, which creates
# the tag + release from the current commit (used when tag pushes aren't
# available). Either way the tag name is the bare version, e.g. `0.1.0`.
on:
  push:
    # `0.1.0` and pre-releases like `0.1.0-rc1`, not `v`-prefixed.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (bare semver, e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: maca-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: maca-linux-aarch64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            asset: maca-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: maca-macos-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: maca-windows-x86_64.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Build
        run: cargo build --release -p maca-driver -p maca-lsp

      # The two steps below are the only inline scripts left in this
      # repository's CI, and they stay scripts. Packaging a Maca program would
      # mean `maca run tools/package.maca`, which compiles that program through
      # the C backend and so needs a C compiler on the runner. Four of the five
      # legs have one; `windows-latest` does not ship a `cc`. Writing it in Maca
      # anyway would either leave a second implementation behind for Windows,
      # exactly the drift this file's siblings exist to avoid, or make cutting
      # a release depend on the compiler being able to build a program on the
      # host whose binaries the release is being cut for.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.asset }}" -C target/release maca maca-lsp

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target\release\maca.exe, target\release\maca-lsp.exe -DestinationPath "dist\${{ matrix.asset }}" -Force

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # a tag push carries the version in `ref_name`; a manual dispatch
          # passes it as `version` and the tag is created from this commit.
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: dist/${{ matrix.asset }}

  scripts:
    name: attach install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload install scripts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: |
            install.sh
            install.ps1
