name: release

# Cut a release either by pushing a plain semver tag (no `v` prefix):
#   git tag 0.1.0 && git push origin 0.1.0
# or by running this workflow manually with a `version` input, which creates
# the tag + release from the current commit (used when tag pushes aren't
# available). Either way the tag name is the bare version, e.g. `0.1.0`.
on:
  push:
    # `0.1.0` and pre-releases like `0.1.0-rc1`, not `v`-prefixed.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (bare semver, e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Ten jobs used to race to create the release for the same tag: whichever got
  # there first won, and a loser could exhaust its retries on `already_exists`
  # and drop its asset. 0.3.2 published nine of ten that way, and the one it
  # lost was the installer this repository's own action downloads. The release
  # is created once here instead, and every leg below only uploads into it.
  create:
    name: create the release
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}

  build:
    name: build ${{ matrix.target }}
    needs: create
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            asset: maca-linux-x86_64.tar.gz
          - target: aarch64-linux-gnu
            asset: maca-linux-aarch64.tar.gz
          - target: x86_64-macos
            asset: maca-macos-x86_64.tar.gz
          - target: aarch64-macos
            asset: maca-macos-aarch64.tar.gz
          - target: x86_64-windows-gnu
            asset: maca-windows-x86_64.zip
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      # Every leg runs on one Linux machine. `zig cc` is the cross compiler, so
      # the five assets come from one seed and one C file each rather than from
      # five runners, and the Windows leg no longer needs a `cc` of its own on
      # a runner that ships none. Taken from ziglang.org rather than an action,
      # whose community mirrors 404.
      - name: Install zig
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o /tmp/zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p /opt/zig
          tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"

      - name: Build the seed compiler
        run: cc -O1 -o bootstrap/maca bootstrap/maca.c

      # The compiler and the language server are Maca programs, so the seed
      # writes each one out as C and zig links that C for the target. The seed
      # stays native: what is cross-compiled is the program it emits.
      - name: Emit the C
        run: |
          mkdir -p build dist
          MACA=$PWD/bootstrap/maca ./bootstrap/maca apps/maca1/main.maca build/maca.c
          MACA=$PWD/bootstrap/maca ./bootstrap/maca apps/lsp/lsp.maca build/maca-lsp.c

      - name: Cross-compile
        run: |
          zig cc -target ${{ matrix.target }} -O1 -o "dist/maca${{ matrix.ext }}" build/maca.c
          zig cc -target ${{ matrix.target }} -O1 -o "dist/maca-lsp${{ matrix.ext }}" build/maca-lsp.c

      - name: Package (tar)
        if: matrix.ext == ''
        run: tar -czf "dist/${{ matrix.asset }}" -C dist maca maca-lsp

      - name: Package (zip)
        if: matrix.ext != ''
        run: cd dist && zip -q "${{ matrix.asset }}" maca.exe maca-lsp.exe

      # The standard library rides inside the binary, so packaging cannot forget
      # it and the archive stays two files. What packaging can still lose is the
      # copy itself, and the only way to see that is from outside the checkout:
      # a program in a temp directory that imports `std/text` has nothing but
      # the binary to resolve it with. Only the leg whose binaries this machine
      # can run is in a position to try it.
      - name: Verify the released binary carries the standard library
        if: matrix.target == 'x86_64-linux-gnu'
        run: |
          probe="$(mktemp -d)"
          printf 'import { lines } from std/text\n\nmain() -> int {\n    n = lines("a").length()\n    n == 1 ? 0 : 1\n}\n' > "$probe/probe.maca"
          (cd "$probe" && "$GITHUB_WORKSPACE/dist/maca" run probe.maca)

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # a tag push carries the version in `ref_name`; a manual dispatch
          # passes it as `version` and the tag is created from this commit.
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: dist/${{ matrix.asset }}

  installer:
    name: build maca-install ${{ matrix.target }}
    needs: create
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            asset: maca-install-linux-x86_64
          - target: aarch64-linux-gnu
            asset: maca-install-linux-aarch64
          - target: x86_64-macos
            asset: maca-install-macos-x86_64
          - target: aarch64-macos
            asset: maca-install-macos-aarch64
          - target: x86_64-windows-gnu
            asset: maca-install-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install zig
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o /tmp/zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p /opt/zig
          tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"

      # The installer is a Maca program too, and it reads its own platform from
      # `uname` at run time, so one source becomes every asset.
      - name: Build the seed compiler
        run: cc -O1 -o bootstrap/maca bootstrap/maca.c

      - name: Build
        run: |
          mkdir -p build dist
          MACA=$PWD/bootstrap/maca ./bootstrap/maca apps/install/install.maca build/install.c
          zig cc -target ${{ matrix.target }} -O1 -o "dist/${{ matrix.asset }}" build/install.c

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          files: dist/${{ matrix.asset }}
