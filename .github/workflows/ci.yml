name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # clang + lld back the native `cc` fallback and the embedded target so
      # those (otherwise-skipped) integration tests actually run in CI.
      - name: Install C / LLVM toolchain
        # llvm provides llvm-objcopy/llvm-size used by the embedded target
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace
