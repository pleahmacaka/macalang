name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update --component clippy rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # clang + lld back the native `cc` fallback and the embedded target so
      # those (otherwise-skipped) integration tests actually run in CI.
      - name: Install C / LLVM toolchain
        # llvm provides llvm-objcopy/llvm-size used by the embedded target
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm libsqlite3-dev

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  js-package:
    name: macalang (npm/bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # build the compiler wasm into the package, then exercise the JS API
      # (compile / loadModule / loadFile / toJS) so it can't silently break.
      - name: Build wasm into the package
        run: bash packages/macalang/build.sh

      - name: Test the package
        run: node packages/macalang/test.mjs
