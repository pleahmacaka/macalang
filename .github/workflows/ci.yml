name: ci

# Every script in this repository is a Maca program; a workflow is not a script
# but a file GitHub reads, in a schema and at a path it chooses, so it stays
# YAML. What is worth checking is that no *program* has been smuggled into it:
# every multi-line `run:` block below installs the Rust or C toolchain that the
# Maca compiler is built with and runs on, so each one executes before there is
# a `maca` to run anything with. Anything after that point is one command, and
# where the command does real work it is `maca run <something>.maca`.
#
# Runs on every branch push (so feature branches get CI, not just main), on
# pull requests, and on manual dispatch.
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same ref cancels the in-flight run, so only the latest
# commit spends runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation only helps across local edits; in CI it bloats the
  # cache and slows cold builds, so turn it off.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # The Maca suites are the compiler's own tests, so they need a working
  # compiler and the frozen stage-0 can no longer build one. bootstrap/maca.c is
  # the compiler emitted by itself; any cc turns it back into a compiler.
  suites:
    name: maca suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm libsqlite3-dev python3-dev elixir
      - name: Build the seed compiler
        run: mkdir -p bin && cc -O1 -o bootstrap/maca bootstrap/maca.c
      - name: Build the compiler with the seed
        run: MACA=$PWD/bootstrap/maca ./bootstrap/maca build apps/maca1/main.maca -o bin/maca
      - name: Install valgrind
        run: sudo apt-get install -y valgrind
      - name: Run the suites
        run: |
          fail=0
          for t in modules/maca/tests/*.maca tests/*.maca modules/std/tests/*.maca modules/http/tests/*.maca modules/chaski/tests/*.maca modules/ai/openai/tests/*.maca modules/signal/tests/*.maca modules/web/tests/*.maca apps/tomo/tests/dev.maca apps/lsp/tests/lsp.maca; do
            MACA=$PWD/bin/maca ./bin/maca test "$t" > /tmp/suite.log 2>&1 || { fail=1; echo "FAIL $t"; cat /tmp/suite.log; }
          done
          rm -f modules/maca/tests/maca1-test-*.maca
          MACA=$PWD/bin/maca ./bin/maca run apps/lint/lint.maca
          exit $fail

  js-package:
    name: macalang (npm/bun)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The package wasm is a Maca program linked by `zig cc -target
      # wasm32-wasi`, so zig is the toolchain this job needs. Taken from
      # ziglang.org rather than an action, whose community mirrors 404.
      - name: Install zig
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o /tmp/zig.tar.xz
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" | sha256sum -c -
          mkdir -p /opt/zig
          tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"
      # build the compiler wasm into the package, then exercise the JS API
      # (compile / loadModule / loadFile / toJS) so it can't silently break.
      # The build step is a Maca program, so the compiler is built first, and
      # `--target wasm` is a compiler the seed grows rather than a Rust one.
      - name: Build the seed compiler
        run: mkdir -p bin && cc -O1 -o bootstrap/maca bootstrap/maca.c
      - name: Build the compiler with the seed
        run: MACA=$PWD/bootstrap/maca ./bootstrap/maca build apps/maca1/main.maca -o bin/maca
      - name: Build wasm into the package
        run: PATH="$PWD/bin:$PATH" MACA=$PWD/bin/maca ./bin/maca run apps/npm/build.maca
      - name: Test the package
        run: node apps/npm/test.mjs
