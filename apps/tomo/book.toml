# Tomo book configuration — The Maca Handbook.

[book]
title = "The Maca Handbook"
authors = ["Maca contributors"]

# i18n is first-class: list the languages the book ships in. The first is the
# default (and the fallback for any chapter not yet translated).
languages = ["en", "ko"]

# Chapter order (filenames, without the .md extension), resolved under
# book/<lang>/. A chapter missing in a non-default language falls back to the
# default language's version.
chapters = [
    "00-introduction",
    "01-getting-started",
    "02-a-first-program",
    "03-common-concepts",
    "04-memory",
    "05-records",
    "06-sum-types",
    "07-modules",
    "08-collections",
    "09-errors",
    "10-types",
    "11-closures",
    "12-testing",
    "13-colorblind-async",
    "14-config-mode",
    "15-targets",
    "16-ffi",
    "17-tooling",
    "18-an-io-project",
    "19-self-hosting",
    "20-tomo",
    "a1-keywords",
    "a2-operators",
    "a3-stdlib",
    "a4-diagnostics",
]
