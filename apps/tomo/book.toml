# Tomo book configuration for The Maca Handbook.

[book]
title = "The Maca Handbook"

# The site's own name, used on the landing page. The book has a title; the
# thing the book is about has a name, and they are not the same string.
site = "Maca"
authors = ["Maca contributors"]

# i18n is first-class: list the languages the book ships in. The first is the
# default (and the fallback for any chapter not yet translated).
languages = ["en", "ko"]

# Chapter order (filenames, without the .md extension), resolved under
# book/<lang>/. A chapter missing in a non-default language falls back to the
# default language's version.
#
# An entry starting with `#` is a heading rather than a page. `##` opens a
# volume, `#` a section inside it. The label carries one title per language,
# `|`-separated in the same order as `languages`; a language with no title of
# its own falls back to the first.
#
# The handbook is two volumes with one table of contents. Learning Maca is read
# front to back once; the Reference is opened at the page you need and answers
# in one screen. A chapter belongs to exactly one of them, and the teaching
# chapter that has a stricter twin links to it by name.
#
# Every chapter file name begins with a digit or `a` and contains a hyphen.
# The digits are Learning Maca's reading order; the `a` series is the Reference,
# which grew out of the appendices and kept their prefix so no published URL
# had to move.
chapters = [
    "## Learning Maca|Maca 배우기",

    "# Getting Started|시작하기",
    "00-introduction",
    "01-installing",
    "01-getting-started",
    "02-a-first-program",

    "# The Language|언어",
    "03-common-concepts",
    "05-records",
    "06-sum-types",
    "08-collections",
    "09-errors",
    "11-closures",
    "07-modules",
    "04-memory",
    "12-testing",

    "# What Maca Does Differently|Maca가 다르게 하는 것",
    "13-colorblind-async",
    "14-config-mode",
    "15-ui",
    "15-targets",

    "# Build Something|만들어 보기",
    "18-an-io-project",

    "## The Reference|레퍼런스",

    "# The Language in Detail|언어 상세",
    "a5-syntax",
    "a1-keywords",
    "a2-operators",
    "a6-types",
    "a7-effects",
    "a8-memory",
    "a9-modules",

    "# Targets and Interop|타깃과 상호운용",
    "a10-targets",
    "a11-ui",
    "a12-config",
    "a13-ffi",

    "# The Toolchain and the Project|툴체인과 프로젝트",
    "a14-tooling",
    "a15-self-hosting",
    "a16-tomo",

    "# Tables|표",
    "a3-stdlib",
    "a4-diagnostics",
]

# Published alongside the book (see .github/workflows/pages.yml).
playground = "play/"
