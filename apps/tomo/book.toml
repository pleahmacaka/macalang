# Tomo book configuration — The Maca Handbook.

[book]
title = "The Maca Handbook"
authors = ["Maca contributors"]

# i18n is first-class: list the languages the book ships in. The first is the
# default (and the fallback for any chapter not yet translated).
languages = ["en", "ko"]

# Chapter order (filenames, without the .md extension), resolved under
# book/<lang>/. A chapter missing in a non-default language falls back to the
# default language's version.
#
# An entry starting with `#` is a section heading rather than a page. Its label
# carries one title per language, `|`-separated in the same order as
# `languages`; a language with no title of its own falls back to the first.
chapters = [
    "# Getting Started|시작하기",
    "00-introduction",
    "01-installing",
    "01-getting-started",
    "02-a-first-program",

    "# The Language|언어",
    "03-common-concepts",
    "04-memory",
    "05-records",
    "06-sum-types",
    "07-modules",
    "08-collections",
    "09-errors",
    "10-types",
    "11-closures",
    "12-testing",

    "# What Maca Does Differently|Maca가 다르게 하는 것",
    "13-colorblind-async",
    "14-config-mode",
    "15-targets",
    "16-ffi",
    "17-tooling",

    "# Real Programs|실제 프로그램",
    "18-an-io-project",
    "19-self-hosting",
    "20-tomo",

    "# Reference|레퍼런스",
    "a1-keywords",
    "a2-operators",
    "a3-stdlib",
    "a4-diagnostics",
]

# Published alongside the book (see .github/workflows/pages.yml).
playground = "play/"
