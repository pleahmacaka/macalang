id = "maca"
name = "Maca"
version = "0.5.7"
schema_version = 1
authors = ["Maca contributors"]
description = "Maca language support for Zed: syntax highlighting, comments, brackets."
repository = "https://github.com/pleahmacaka/macalang"

# The tree-sitter grammar lives in this repo under editor/tree-sitter-maca.
# `commit` must point at a revision that contains the generated src/parser.c
# (Zed compiles it directly). Bump it whenever the grammar is regenerated.
[grammars.maca]
repository = "https://github.com/pleahmacaka/macalang"
path = "editor/tree-sitter-maca"
commit = "caeea09b61ba400d1949289667218444eb6009f8"

# The Maca language server (crates/lsp → the `maca-lsp` binary). The extension's
# Rust code (src/lib.rs) resolves it from the worktree PATH.
[language_servers.maca-lsp]
name = "Maca Language Server"
languages = ["Maca"]
